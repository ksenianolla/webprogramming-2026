<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PigeonExpress — successful payment</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page">
  <header class="site-header">
    <a class="site-header__logo" href="index.html">PigeonExpress</a>
    <nav class="site-header__nav site-header__nav--back" aria-label="Back">
      <a class="back-link" href="index.html" aria-label="Back to the catalog">
        <svg class="back-link__icon" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true">
          <polyline points="11.6,1.6 3,12 11.6,22.4"/>
        </svg>
      </a>
    </nav>
  </header>

  <main class="payment-result">
    <img class="payment-result__bird payment-result__bird--owl" src="images/owl.png" width="410" height="402" alt="">
    <img class="payment-result__bird payment-result__bird--dove" src="images/dove.png" width="366" height="359" alt="">
    <h1 class="payment-result__title">Successful payment!!!</h1>
    <p class="payment-result__message">Your bird is on it’s way. Do not forget to write your message and open the window!</p>
    <p class="payment-result__wait">
      <a class="payment-result__track" href="order-status.html">Approximate wait time: <time datetime="PT5M">5 min</time></a>
    </p>
    <img class="payment-result__bird payment-result__bird--pigeon" src="images/pigeon-large.png" width="725" height="779" alt="">
  </main>
</body>
</html>
