<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PigeonExpress — order status</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/pages/order-status.js"></script>
</head>
<body class="page">
  <header class="site-header">
    <a class="site-header__logo" href="index.html">PigeonExpress</a>
    <nav class="site-header__nav site-header__nav--back" aria-label="Back">
      <a class="back-link" href="index.html" aria-label="Back to the catalog">
        <svg class="back-link__icon" viewBox="0 0 14 24" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true">
          <polyline points="11.6,1.6 3,12 11.6,22.4"/>
        </svg>
      </a>
    </nav>
  </header>

  <main class="order-status">
    <h1 class="order-status__title" id="status-title">Your bird in on it’s way!</h1>
    <p class="order-status__arrival" id="status-arrival" aria-live="polite">Arrives in ~ <time datetime="PT3M">3 min</time></p>
    <dl class="order-status__details" id="status-details" hidden></dl>
    <button class="order-action order-status__action" id="status-finish" type="button" hidden>new order</button>
    <a class="order-action order-status__action" id="status-catalog" href="index.html" hidden>choose a bird</a>
  </main>
</body>
</html>
